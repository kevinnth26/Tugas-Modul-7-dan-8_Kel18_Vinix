<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Tersedia - RuangWarga</title>
    <link rel="stylesheet" href="katalog.css">
</head>
<body>
    <div class="mobile-wrapper">
        <div class="header">
            <a href="index.html" class="back-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A365D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <div class="header-text">
                <h1>Katalog Inventaris</h1>
                <p>Aset bersama RT 01/RW 02</p>
            </div>
        </div>
        <hr class="divider">

        <div class="content-area">
            <div class="search-container">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="search-input" placeholder="Cari aset warga...">
            </div>

            <!-- Tab Filter (Tersedia Aktif) -->
            <div class="tabs">
                <a href="katalog.html" class="tab-pill">Semua</a>
                <a href="katalog-tersedia.html" class="tab-pill active">Tersedia</a>
                <a href="katalog-dipinjam.html" class="tab-pill">Dipinjam</a>
            </div>

            <div class="katalog-grid">
                <div class="katalog-card">
                    <img src="assets/images/kursilipat.png" alt="Kursi Lipat" class="card-img">
                    <div class="card-body">
                        <h3>Kursi Lipat</h3>
                        <span class="status text-green">24 unit tersedia</span>
                        <button class="btn-pinjam active" onclick="window.location.href='form-peminjaman.html'">Pinjam</button>
                    </div>
                </div>
                <div class="katalog-card">
                    <img src="assets/images/mejapanjang.png" alt="Meja Panjang" class="card-img">
                    <div class="card-body">
                        <h3>Meja Panjang</h3>
                        <span class="status text-green">8 unit tersedia</span>
                        <button class="btn-pinjam active" >Pinjam</button>
                    </div>
                </div>
                <div class="katalog-card">
                    <img src="assets/images/pengerassuara.png" alt="Pengeras Suara" class="card-img">
                    <div class="card-body">
                        <h3>Pengeras Suara</h3>
                        <span class="status text-green">2 unit tersedia</span>
                        <button class="btn-pinjam active" >Pinjam</button>
                    </div>
                </div>
            </div>

            <p class="footer-note">Ketersediaan diperbarui oleh pengurus secara berkala.</p>
            <div style="height: 80px;"></div>
        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Beranda</span>
            </a>
            <a href="katalog.html" class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                <span>Katalog</span>
            </a>
            <a href="profil.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Profil</span>
            </a>
        </div>
    </div>
    <script src="katalog.js"></script>
</body>
</html>
