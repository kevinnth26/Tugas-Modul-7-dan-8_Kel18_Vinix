<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Keluarga - Admin</title>
    <link rel="stylesheet" href="data-keluarga.css">
</head>
<body>
    <div class="mobile-wrapper">
        <!-- Header -->
        <div class="header">
            <a href="data-warga.html" class="back-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A365D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <div class="header-text">
                <h1>Data Warga</h1>
                <p>Data Warga RT 01/RW 02</p>
            </div>
        </div>
        <hr class="divider">

        <div class="content-area">
            <!-- Profil Kepala Keluarga -->
            <div class="family-profile-card">
                <div class="profile-header">
                    <div class="avatar-large" id="profileAvatar">AP</div>
                    <div class="profile-title">
                        <h2 id="profileName">Nama Kepala Keluarga</h2>
                        <p id="profileAddress">Alamat • Jumlah Anggota</p>
                        <span class="phone-text" id="profilePhone">08xx-xxxx-xxxx</span>
                    </div>
                </div>
            </div>

            <!-- Section Title -->
            <div class="section-title">
                <h3>Anggota Keluarga</h3>
            </div>

            <!-- Container Daftar Anggota Keluarga yang Dinamis -->
            <div class="member-list" id="memberList">
                <!-- Data akan dimasukkan otomatis oleh JavaScript -->
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons-container">
                <button class="btn-admin" onclick="triggerAdminAction()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4-4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Jadikan Admin
                </button>
                <button class="btn-kk" onclick="triggerKKAction()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    Lihat Dokumen KK
                </button>
            </div>

            <div style="height: 40px;"></div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast">Berhasil memperbarui status admin!</div>

    <script src="data-keluarga.js"></script>
</body>
</html>
