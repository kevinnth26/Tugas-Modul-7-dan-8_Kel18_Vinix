<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f3a">
  <title>Pengaduan – RuangWarga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="pengaduan.css">
  <script src="common.js" defer></script>
  <script src="pengaduan.js" defer></script>
</head>
<body>

<div class="app" id="app">
  <main id="main">

    <section class="view" aria-label="Pengaduan">
      <header class="appbar">
        <a class="appbar__back" href="profil.html" aria-label="Kembali ke Profil"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></a>
        <div class="appbar__text">
          <h1>Pengaduan</h1>
          <p>Laporkan kejadian di lingkungan Anda</p>
        </div>
      </header>

      <form class="stack stack--plain" id="form-pengaduan" novalidate>
        <div>
          <h2 class="form-title">Buat laporan baru</h2>
          <p class="lead">Berikan informasi yang jelas agar pengurus dapat menindaklanjuti laporan dengan tepat.</p>
        </div>

        <div class="field">
          <label for="p-deskripsi">Deskripsi Kejadian</label>
          <textarea id="p-deskripsi" class="textarea" rows="3" placeholder="Jelaskan lokasi, waktu, dan kronologi kejadian..." required></textarea>
          <p class="error" id="err-deskripsi" role="alert"></p>
        </div>

        <div class="field">
          <label id="p-foto-label">Upload Foto</label>
          <input type="file" id="p-foto" accept="image/jpeg,image/png" hidden>
          <button type="button" class="dropzone" id="p-drop" aria-labelledby="p-foto-label">
            <span class="dropzone__empty" id="p-drop-empty">
              <svg class="i dropzone__icon" aria-hidden="true"><use href="#i-upload"/></svg>
              <strong>Pilih foto dari perangkat</strong>
              <small>JPG atau PNG, maksimal 2 MB</small>
            </span>
            <span class="dropzone__preview" id="p-drop-preview" hidden>
              <img id="p-preview-img" alt="Pratinjau foto laporan">
              <span class="dropzone__file" id="p-preview-name"></span>
              <span class="dropzone__remove" id="p-remove" role="button" tabindex="0" aria-label="Hapus foto"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></span>
            </span>
          </button>
          <p class="error" id="err-foto" role="alert"></p>
        </div>

        <p class="hint">
          <svg class="i" aria-hidden="true"><use href="#i-help"/></svg>
          <span>Pastikan foto tidak memuat data pribadi warga lain tanpa izin.</span>
        </p>

        <button type="submit" class="btn btn--primary">Kirim Laporan</button>
      </form>
    </section>

  </main>
</div>

</body>
</html>
