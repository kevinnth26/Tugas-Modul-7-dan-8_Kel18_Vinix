<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - RuangWarga</title>
    <link rel="stylesheet" href="signin.css">
</head>
<body>
    <div class="mobile-wrapper">
        <div class="top-section">
            <div class="logo-container">
                <div class="logo-box">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"/>
                    </svg>
                </div>
                <h1>RuangWarga</h1>
                <p>RT 01/RW 02 Kemang</p>
            </div>
        </div>

        <div class="bottom-section">
            <h2>Selamat datang kembali</h2>
            <p class="subtitle">Kelola layanan warga, iuran, dan inventaris lingkungan dalam satu ruang yang aman.</p>
            
            <form id="signinForm">
                <div class="input-group">
                    <label>Email/NIK</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" placeholder="Masukkan email atau NIK" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" placeholder="Masukkan password" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" checked>
                        Ingat saya
                    </label>
                    <a href="#" class="forgot-link">Lupa kata sandi?</a>
                </div>

                <button type="submit" class="btn-primary">Masuk</button>
                
                <p class="register-link">Belum punya akun? <a href="signup.html">Daftar di sini</a></p>

                <div class="info-box">
                    <span class="dot"></span>
                    <p>Akses resmi untuk warga dan pengurus RT 01/RW 02.</p>
                </div>
            </form>
        </div>
    </div>
    <script src="signin.js"></script>
</body>
</html>
