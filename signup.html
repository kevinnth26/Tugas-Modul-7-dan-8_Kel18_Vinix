<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - RuangWarga</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="mobile-wrapper">
        <div class="header">
            <a href="signin.html" class="back-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A365D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <div class="header-text">
                <h1>Buat Akun Warga</h1>
                <p>Daftarkan identitas Anda dengan aman</p>
            </div>
        </div>
        <hr class="divider">

        <div class="content-section">
            <h2>Daftar sebagai warga</h2>
            <p class="subtitle">Gunakan data yang sesuai dengan administrasi lingkungan agar proses verifikasi lebih cepat.</p>

            <form id="signupForm">
                <div class="input-group">
                    <label>NIK</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" placeholder="Masukkan 16 digit NIK" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Nama Lengkap</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" placeholder="Masukkan nama sesuai KTP" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Email (Opsional)</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <input type="email" placeholder="contoh@surat.id">
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" placeholder="••••••••" required>
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A365D" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </div>
                </div>

                <div class="input-group">
                    <label>Konfirmasi Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" placeholder="••••••••" required>
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A365D" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Daftar</button>
            </form>
        </div>
    </div>
    <script src="signup.js"></script>
</body>
</html>
