<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f3a">
  <title>Detail Profil – RuangWarga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="detail-profil.css">
  <script src="common.js" defer></script>
  <script src="detail-profil.js" defer></script>
</head>
<body>

<div class="app" id="app">
  <main id="main">

    <section class="view" aria-label="Detail Profil">
      <header class="appbar">
        <a class="appbar__back" href="profil.html" aria-label="Kembali ke Profil"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></a>
        <div class="appbar__text">
          <h1>Detail Profil</h1>
          <p>Perbarui identitas dan keamanan akun</p>
        </div>
      </header>

      <form class="stack" id="form-profil" novalidate>
        <fieldset class="card">
          <legend class="card__title">Informasi pribadi</legend>
          <p class="card__sub">Data ini digunakan untuk keperluan layanan lingkungan.</p>

          <div class="field">
            <label for="f-nama">Nama Lengkap</label>
            <div class="input-wrap">
              <svg class="i input-wrap__lead" aria-hidden="true"><use href="#i-user"/></svg>
              <input id="f-nama" name="nama" type="text" autocomplete="off" placeholder="Budi Santoso">
            </div>
            <p class="error" id="err-nama" role="alert"></p>
          </div>

          <div class="field">
            <label for="f-email">Email</label>
            <div class="input-wrap">
              <svg class="i input-wrap__lead" aria-hidden="true"><use href="#i-mail"/></svg>
              <input id="f-email" name="email" type="email" autocomplete="off" placeholder="budi.santoso@surat.id">
            </div>
            <p class="error" id="err-email" role="alert"></p>
          </div>
        </fieldset>

        <fieldset class="card">
          <legend class="card__title">Ubah Sandi</legend>
          <p class="card__sub">Gunakan sandi baru yang kuat dan mudah Anda ingat.</p>

          <div class="field">
            <label for="f-sandi-lama">Sandi Lama</label>
            <div class="input-wrap">
              <svg class="i input-wrap__lead" aria-hidden="true"><use href="#i-lock"/></svg>
              <input id="f-sandi-lama" name="sandiLama" type="password" autocomplete="current-password" placeholder="Masukkan sandi lama" required>
              <button type="button" class="input-wrap__toggle" data-toggle="f-sandi-lama" aria-label="Tampilkan sandi lama" aria-pressed="false">
                <svg class="i" aria-hidden="true"><use href="#i-eye"/></svg>
              </button>
            </div>
            <p class="error" id="err-sandi-lama" role="alert"></p>
          </div>

          <div class="field">
            <label for="f-sandi-baru">Sandi Baru</label>
            <div class="input-wrap">
              <svg class="i input-wrap__lead" aria-hidden="true"><use href="#i-lock"/></svg>
              <input id="f-sandi-baru" name="sandiBaru" type="password" autocomplete="new-password" placeholder="Minimal 8 karakter" required>
              <button type="button" class="input-wrap__toggle" data-toggle="f-sandi-baru" aria-label="Tampilkan sandi baru" aria-pressed="false">
                <svg class="i" aria-hidden="true"><use href="#i-eye"/></svg>
              </button>
            </div>
            <p class="error" id="err-sandi-baru" role="alert"></p>
          </div>
        </fieldset>

        <button type="submit" class="btn btn--primary">Simpan Perubahan</button>
      </form>
    </section>

  </main>
</div>

</body>
</html>
